openapi: 3.0.3
info:
  title: Widgets API
  version: 2.0.0
paths:
  /widgets:
    get:
      operationId: listWidgets
      responses:
        '200':
          description: A list of widgets.
    delete:
      operationId: deleteAllWidgets
      responses:
        '204':
          description: Deleted.
  /gadgets:
    get:
      operationId: listGadgets
      responses:
        '200':
          description: A list of gadgets.
