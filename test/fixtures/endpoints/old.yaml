openapi: 3.0.3
info:
  title: Widgets API
  version: 1.0.0
paths:
  /widgets:
    get:
      operationId: listWidgets
      responses:
        '200':
          description: A list of widgets.
    post:
      operationId: createWidget
      responses:
        '201':
          description: Created.
  /legacy-widgets:
    get:
      operationId: listLegacyWidgets
      responses:
        '200':
          description: A list of widgets.
