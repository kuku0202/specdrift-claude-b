openapi: 3.0.3
info:
  title: Widgets API
  version: 1.0.0
paths:
  /widgets/{id}:
    get:
      operationId: getWidget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The widget.
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
            text/csv:
              schema:
                type: string
        '404':
          description: Not found.
        '500':
          description: Server error.
components:
  schemas:
    Widget:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        ownerId:
          type: string
        status:
          type: string
          enum: [active, archived]
