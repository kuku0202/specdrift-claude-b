openapi: 3.0.3
info:
  title: Widgets API
  version: 2.0.0
paths:
  /widgets/{id}:
    get:
      operationId: getWidget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The widget.
          headers:
            X-Request-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Widget'
        '201':
          description: Created on demand.
        '429':
          description: Too many requests.
        '500':
          description: Server error.
components:
  schemas:
    Widget:
      type: object
      required:
        - id
        - ownerId
      properties:
        id:
          type: string
          nullable: true
        ownerId:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [active, archived, pending]
