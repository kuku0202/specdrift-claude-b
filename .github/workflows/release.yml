name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "Publishing version $pkg"

      # Fail fast and legibly when the NPM_TOKEN secret is missing or expired,
      # rather than discovering it several minutes in at the publish step.
      # `npm whoami` prints the account name, never the token.
      - name: Verify registry authentication
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::the NPM_TOKEN repository secret is not set"
            exit 1
          fi
          echo "Authenticated to the npm registry as $(npm whoami)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Publishing is idempotent so that re-running a release, or tagging a
      # version that was first published by hand, is a no-op rather than a hard
      # failure on npm's EPUBLISHCONFLICT.
      - name: Check whether this version is already on the registry
        id: published
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$name@$version is already published; nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "$name@$version is not on the registry yet."
          fi

      - name: Publish
        if: steps.published.outputs.already == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "${{ steps.published.outputs.already }}" = "true" ]; then
            echo "Skipped publish: $name@$version was already on the registry." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published $name@$version to npm." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "https://www.npmjs.com/package/$name/v/$version" >> "$GITHUB_STEP_SUMMARY"
